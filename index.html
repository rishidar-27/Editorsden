<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gogangs Editor Management Portal</title>
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/logo.png" />
    <style>
      :root {
        --preloader-bg: #FAFAFA;
        --preloader-text: #101013;
        --preloader-track: rgba(0, 0, 0, 0.06);
        --preloader-bar: #101013;
      }
      html.dark {
        --preloader-bg: #09090B;
        --preloader-text: #FAFAFA;
        --preloader-track: rgba(255, 255, 255, 0.08);
        --preloader-bar: #FAFAFA;
      }
      @keyframes gogangs-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.97); opacity: 0.85; }
      }
      @keyframes gogangs-slide {
        0% { left: -45%; width: 35%; }
        50% { left: 30%; width: 50%; }
        100% { left: 100%; width: 35%; }
      }
    </style>
    <script>
      try {
        var theme = localStorage.getItem('gogangs_theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <div id="app-preloader" style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: var(--preloader-bg); font-family: 'Inter', system-ui, sans-serif; z-index: 9999; transition: opacity 0.3s ease;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 20px; animation: gogangs-pulse 2s ease-in-out infinite;">
          <div style="font-size: 38px; font-weight: 900; letter-spacing: -0.04em; color: var(--preloader-text); display: flex; align-items: baseline; user-select: none;">
            <span>Gogangs</span><span style="color: #ec4899; font-size: 44px; line-height: 0; margin-left: 2px;">.</span>
          </div>
          <div style="width: 140px; height: 3px; background: var(--preloader-track); border-radius: 9999px; overflow: hidden; position: relative;">
            <div style="position: absolute; top: 0; bottom: 0; left: 0; background: var(--preloader-bar); border-radius: 9999px; animation: gogangs-slide 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
