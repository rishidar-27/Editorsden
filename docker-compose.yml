version: '3.8'

services:
  # 1. Local PostgreSQL Database (Emulating Supabase)
  postgres:
    image: postgres:15-alpine
    container_name: gogangs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: gogangs
    ports:
      - '5432:5432'
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gogangs-network

  # 2. Local MinIO S3 Object Storage (Emulating Cloudflare R2)
  minio:
    image: minio/minio:latest
    container_name: gogangs-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - '9000:9000' # S3 API endpoint
      - '9001:9001' # Web Console
    volumes:
      - minio_data:/data
    networks:
      - gogangs-network

  # 3. Bucket Auto-Creation Job
  minio-init:
    image: minio/mc:latest
    container_name: gogangs-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadminpassword;
      /usr/bin/mc mb --ignore-existing local/gogangs-media;
      /usr/bin/mc anonymous set download local/gogangs-media;
      echo 'MinIO Bucket gogangs-media successfully initialized!';
      exit 0;
      "
    networks:
      - gogangs-network

networks:
  gogangs-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
